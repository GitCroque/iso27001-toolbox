# GitHub Actions Workflow for ISO 27001 Compliance Checks
# File: .github/workflows/iso27001-compliance.yml

name: ISO 27001 Compliance Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Manual trigger

jobs:
  compliance-check:
    name: ISO 27001 Compliance Verification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install ISO 27001 Toolkit
        run: |
          pip install --upgrade pip
          pip install iso27001-toolkit[pdf]
      
      - name: Initialize ISO 27001 Project
        run: |
          # Restore .iso27001/ from repo if it exists
          if [ -d ".iso27001" ]; then
            cp -r .iso27001 ~/.iso27001
          fi
      
      - name: Run Doctor Diagnostic
        id: doctor
        run: |
          iso27001 doctor || echo "DOCTOR_FAILED=true" >> $GITHUB_OUTPUT
          iso27001 doctor > doctor_report.txt
      
      - name: Check Critical Risks
        id: risks
        run: |
          CRITICAL_COUNT=$(iso27001 risks list --level critical --count || echo "0")
          echo "CRITICAL_RISKS=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$CRITICAL_COUNT" -gt 5 ]; then
            echo "::error::Too many critical risks: $CRITICAL_COUNT (max: 5)"
            exit 1
          fi
      
      - name: Verify Control Implementation
        id: controls
        run: |
          # Get control statistics
          TOTAL=$(iso27001 controls list --count || echo "114")
          IMPLEMENTED=$(iso27001 controls list --status implemented --count || echo "0")
          VERIFIED=$(iso27001 controls list --status verified --count || echo "0")
          
          COMPLETED=$((IMPLEMENTED + VERIFIED))
          PERCENTAGE=$((COMPLETED * 100 / TOTAL))
          
          echo "MATURITY=$PERCENTAGE" >> $GITHUB_OUTPUT
          echo "::notice::Control Maturity: $PERCENTAGE% ($COMPLETED/$TOTAL)"
          
          # Fail if maturity < 75%
          if [ "$PERCENTAGE" -lt 75 ]; then
            echo "::error::Control maturity below 75%: $PERCENTAGE%"
            exit 1
          fi
      
      - name: Generate Compliance Reports
        if: success() || failure()
        run: |
          mkdir -p compliance_reports
          
          # Generate SOA
          iso27001 audit soa --output compliance_reports/soa.md || true
          
          # Generate risk register
          iso27001 risks report --output compliance_reports/risk_register.md || true
          
          # Generate gap analysis
          iso27001 audit gap-analysis --output compliance_reports/gap_analysis.md || true
      
      - name: Export PDF Reports
        if: success()
        run: |
          mkdir -p compliance_reports/pdf
          
          iso27001 export soa --output compliance_reports/pdf/soa.pdf || true
          iso27001 export risks --output compliance_reports/pdf/risks.pdf || true
      
      - name: Upload Compliance Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: iso27001-compliance-reports
          path: compliance_reports/
          retention-days: 90
      
      - name: Create Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # ISO 27001 Compliance Check Summary
          
          ## Results
          
          - **Critical Risks**: ${{ steps.risks.outputs.CRITICAL_RISKS }}
          - **Control Maturity**: ${{ steps.controls.outputs.MATURITY }}%
          - **Doctor Status**: ${{ steps.doctor.outcome }}
          
          ## Artifacts
          
          Compliance reports have been uploaded as build artifacts.
          
          Download them from the Actions tab.
          EOF
      
      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::ISO 27001 Compliance Check FAILED"
          echo "Please review the compliance reports and take corrective action."
          
          # Optional: Send notification (Slack, Email, etc.)
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"ISO 27001 Compliance check failed!"}'

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
